<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Google Fonts — Inter 500 / 600 / 700 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet" />

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/project-page.css" />

    <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />

<body>

    <div class="page">
        <!-- ═══════════════════════════════════════════════════════════════════
         Header
         ═══════════════════════════════════════════════════════════════════ -->
        <nav class="header" id="header">
            <a href="index.html" class="header__brand">
                <img src="assets/logo.svg" alt="Logo" class="header__logo" />
                <span class="header__name">Slava Zhidkov</span>
            </a>
            <div class="header__nav">
                <a href="index.html" class="header__nav-link header__nav-link--active">Work</a>
                <a href="about.html" class="header__nav-link">About</a>
            </div>
        </nav>

        <!-- ═══════════════════════════════════════════════════════════════════
         Hero
         ═══════════════════════════════════════════════════════════════════ -->
        <section class="project-hero" id="hero">
            <span class="project-hero__year">2016</span>
            <h1 class="project-hero__title">AnyTalk Messenger</h1>
            <p class="project-hero__description">
                Free and secure messaging app which works across all your devices. Available for
                <a href="https://apps.apple.com/us/app/anytalk-messenger/id964490549" class="project-hero__link"
                    target="_blank" rel="noopener">iOS</a>
                and
                <a href="https://play.google.com/store/apps/details?id=com.anytalkapp" class="project-hero__link"
                    target="_blank" rel="noopener">Android</a>.
            </p>
        </section>

         ═══════════════════════════════════════════════════════════════════ -->
        <section class="project-content">
            <div class="project-content__images">
                <img src="assets/anytalk-01-cut01.png" alt="AnyTalk Messenger" class="project-content__slice"

                <img src="assets/anytalk-01-cut02.png" alt="AnyTalk Messenger" class="project-content__slice"
                    loading="lazy" />
                <img src="assets/anytalk-02-cut01.png" alt="AnyTalk Messenger" class="project-content__slice"
                    loading="lazy" />
                <img src="assets/anytalk-02-cut02.png" alt="AnyTalk Messenger" class="project-content__slice"
                    loading="lazy" />
                <img src="assets/anytalk-icons.png" alt="AnyTalk Messenger" class="project-content__slice"
                    loading="lazy" />
                <img src="assets/anytalk-03.png" alt="AnyTalk Messenger" class="project-content__slice"
                    loading="lazy" />
            </div>
        </section>
    </div>

    <!-- ═══════════════════════════════════════════════════════════════════

    <footer class="footer footer--project">
        <button class="footer__back-to-top" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑ Back to top</button>
        <nav class="footer__links">
            <a href="https://www.linkedin.com/in/slavazhidkov/" class="footer__link" target="_blank"

            <a href="mailto:slastradamus@gmail.com" class="footer__link">Email</a>
            <a href="https://www.instagram.com/slavazhidkov/" class="footer__link" target="_blank"
